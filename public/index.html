<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJH PANEL - Cloud Control Surface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #05070a; color: #d0d7de; height: 100vh; overflow: hidden; }

        /* Login Screen */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #120b1e 0%, #1a0f2e 50%, #08040d 100%);
            display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .login-card {
            background: rgba(22, 17, 33, 0.75); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px); padding: 40px; border-radius: 16px; width: 380px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .login-card h2 { font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 5px; }
        .login-card p { font-size: 13px; color: #8b949e; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4); border: 1px solid #30363d;
            border-radius: 8px; color: #fff; font-size: 14px; outline: none;
        }
        .login-btn {
            width: 100%; padding: 12px; background: #ffffff; border: none; color: #000;
            font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .login-btn:hover { background: #e6e6e6; }

        /* App Wrapper */
        #app-wrapper { display: flex; height: 100vh; }
        .sidebar { width: 240px; background: #090d14; border-right: 1px solid #161b22; display: flex; flex-direction: column; padding: 20px 12px; }
        .brand { font-size: 18px; font-weight: 900; color: #ffffff; padding: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .nav-section { font-size: 11px; text-transform: uppercase; color: #484f58; font-weight: 700; margin: 15px 10px 8px; }
        .nav-item { padding: 10px 12px; border-radius: 6px; font-size: 13px; color: #8b949e; cursor: pointer; margin-bottom: 2px; }
        .nav-item:hover, .nav-item.active { background: #161b22; color: #58a6ff; font-weight: 600; }

        /* Main Dashboard */
        .main-content { flex: 1; background: #05070a; overflow-y: auto; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #161b22; padding-bottom: 15px; }
        .tab-page { display: none; }
        .tab-page.active { display: block; }

        /* Server Cards UI */
        .server-card { background: #0d1117; border: 1px solid #161b22; border-radius: 10px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .server-card:hover { border-color: #30363d; }
        .server-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #da3633; margin-right: 6px; }
        .status-dot.online { background: #238636; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 12px; color: #8b949e; }
        .stats-grid div span { display: block; color: #fff; font-weight: bold; margin-top: 4px; font-size: 14px; }

        /* Console Interface */
        .console-box { background: #000000; border: 1px solid #161b22; border-radius: 8px; height: 420px; padding: 15px; font-family: monospace; font-size: 13px; color: #3fb950; overflow-y: auto; margin-bottom: 15px; }
        .cmd-bar { display: flex; gap: 10px; }
        .cmd-bar input { flex: 1; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px 14px; color: #fff; }
        .action-btn { padding: 8px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-green { background: #238636; color: #fff; }
        .btn-red { background: #da3633; color: #fff; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <h2>CJH PANEL Login</h2>
            <p>Welcome to the panel</p>
            <div class="input-group">
                <input type="text" id="login-user" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="login-pass" placeholder="Password">
            </div>
            <button class="login-btn" onclick="performLogin()">Sign In</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app-wrapper">
        <div class="sidebar">
            <div class="brand">⚡ CJH PANEL</div>
            
            <div class="nav-section">Menu</div>
            <div class="nav-item active" onclick="switchTab('overview')">Overview</div>
            <div class="nav-item" onclick="switchTab('nodes')">Nodes</div>
            <div class="nav-item" onclick="switchTab('servers')">Servers</div>
            <div class="nav-item" onclick="switchTab('console')">Console</div>
            
            <div class="nav-section">Management</div>
            <div class="nav-item" onclick="switchTab('settings')">Admin Settings</div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <h3 id="page-title">Overview</h3>
                <span id="user-badge" style="font-size: 12px; color: #8b949e;">Logged in as Admin</span>
            </div>

            <!-- TAB: OVERVIEW & SERVERS -->
            <div id="tab-overview" class="tab-page active">
                <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 20px;">MY SERVERS</h1>
                <div id="server-list-container"></div>
            </div>

            <!-- TAB: NODES -->
            <div id="tab-nodes" class="tab-page">
                <h1 style="font-size: 28px; font-weight: 800; margin-bottom: 20px;">Nodes</h1>
                <div id="nodes-list-container"></div>
            </div>

            <!-- TAB: CONSOLE -->
            <div id="tab-console" class="tab-page">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h2 id="current-server-name">chachaji</h2>
                    <div>
                        <button class="action-btn btn-green" onclick="triggerServerAction('start')">Start</button>
                        <button class="action-btn btn-red" onclick="triggerServerAction('stop')">Stop</button>
                    </div>
                </div>
                <div class="console-box" id="console-output"></div>
                <div class="cmd-bar">
                    <input type="text" id="cmd-input" placeholder="Type a command...">
                    <button class="action-btn btn-green" onclick="sendConsoleCommand()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let selectedServerId = "srv-chachaji";

        function performLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    loadServers();
                    loadNodes();
                } else {
                    alert('Invalid Username or Password');
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            const target = document.getElementById(`tab-${tabId}`);
            if(target) target.classList.add('active');
            
            document.getElementById('page-title').innerText = tabId.toUpperCase();
        }

        function loadServers() {
            fetch('/api/servers').then(r => r.json()).then(servers => {
                const container = document.getElementById('server-list-container');
                container.innerHTML = servers.map(s => `
                    <div class="server-card" onclick="openServerConsole('${s.id}', '${s.name}')">
                        <div class="server-header">
                            <h3>${s.name}</h3>
                            <span style="font-size:12px; color:#8b949e;">
                                <span class="status-dot ${s.status === 'ONLINE' ? 'online' : ''}"></span> ${s.status}
                            </span>
                        </div>
                        <div class="stats-grid">
                            <div>CPU LIMIT<span>${s.cpu}</span></div>
                            <div>RAM USAGE<span>${s.ram}</span></div>
                            <div>DISK LIMIT<span>${s.disk}</span></div>
                            <div>VERSION<span>${s.version}</span></div>
                        </div>
                    </div>
                `).join('');
            });
        }

        function loadNodes() {
            fetch('/api/nodes').then(r => r.json()).then(nodes => {
                const container = document.getElementById('nodes-list-container');
                container.innerHTML = nodes.map(n => `
                    <div class="server-card">
                        <h3>${n.name}</h3>
                        <p style="color:#8b949e; font-size:12px; margin-bottom:15px;">${n.host}</p>
                        <div class="stats-grid">
                            <div>CPU<span>${n.cpu}</span></div>
                            <div>MEMORY<span>${n.ram}</span></div>
                            <div>DISK<span>${n.disk}</span></div>
                            <div>UPTIME<span>${n.uptime}</span></div>
                        </div>
                    </div>
                `).join('');
            });
        }

        function openServerConsole(id, name) {
            selectedServerId = id;
            document.getElementById('current-server-name').innerText = name;
            switchTab('console');
        }

        function triggerServerAction(action) {
            socket.emit(`${action}-server`, selectedServerId);
        }

        function sendConsoleCommand() {
            const input = document.getElementById('cmd-input');
            if(input.value) {
                socket.emit('command', { serverId: selectedServerId, command: input.value });
                input.value = '';
            }
        }

        socket.on('console-log', msg => {
            const box = document.getElementById('console-output');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('server-status-updated', () => loadServers());
    </script>
</body>
</html>
